<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>记账本 · 日常消费</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PERSONAL LEDGER</p>
          <h1>记账本</h1>
        </div>
        <div class="date-chip" id="todayLabel"></div>
      </header>

      <main>
        <section class="hero-card" aria-labelledby="todayHeading">
          <div class="hero-topline">
            <span id="todayHeading">今日支出</span>
            <span class="hero-dot" aria-hidden="true"></span>
          </div>
          <div class="today-total"><span>¥</span><strong id="todayTotal">0.00</strong></div>
          <p class="muted" id="todayCount">今天还没有记录</p>
        </section>

        <section class="section-block summary-section" aria-labelledby="summaryHeading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">OVERVIEW</p>
              <h2 id="summaryHeading">消费汇总</h2>
            </div>
            <label class="month-picker">
              <span class="sr-only">选择月份</span>
              <input type="month" id="monthFilter" />
            </label>
          </div>
          <div class="summary-grid">
            <div class="summary-card"><span>本月支出</span><strong id="monthTotal">¥0.00</strong><small id="monthCount">0 笔记录</small></div>
            <div class="summary-card"><span>日均支出</span><strong id="averageTotal">¥0.00</strong><small id="averageHint">按有记录天数计算</small></div>
          </div>
        </section>

        <section class="section-block records-section" aria-labelledby="recordsHeading">
          <div class="section-heading records-heading">
            <div>
              <p class="eyebrow">RECENT ACTIVITY</p>
              <h2 id="recordsHeading">近期记录</h2>
            </div>
            <label class="date-filter">
              <span class="sr-only">按日期查看</span>
              <input type="date" id="dateFilter" />
            </label>
          </div>
          <button class="clear-filter hidden" id="clearFilter" type="button">查看全部记录</button>
          <div id="recordList" class="record-list"></div>
        </section>
      </main>

      <button class="add-button" id="openAdd" type="button"><span aria-hidden="true">＋</span> 新增记账</button>
    </div>

    <div class="modal-backdrop hidden" id="formModal" role="presentation">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
        <div class="modal-header">
          <div><p class="eyebrow">NEW ENTRY</p><h2 id="formTitle">新增记账</h2></div>
          <button class="icon-button" id="closeModal" type="button" aria-label="关闭">×</button>
        </div>
        <div class="form-message" id="formMessage" role="alert"></div>
        <form id="expenseForm" novalidate>
          <label class="field amount-field">
            <span>消费金额 <em>*</em></span>
            <div class="amount-input"><b>¥</b><input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" /></div>
          </label>
          <fieldset class="field category-field">
            <legend>消费分类 <em>*</em></legend>
            <div class="category-options" id="categoryOptions"></div>
          </fieldset>
          <label class="field"><span>消费日期</span><input id="expenseDate" name="date" type="date" /></label>
          <label class="field"><span>备注 <small>选填</small></span><input id="note" name="note" type="text" maxlength="60" placeholder="例如：和朋友吃晚餐" /></label>
          <button class="primary-button" type="submit" id="saveButton">保存记录</button>
        </form>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
