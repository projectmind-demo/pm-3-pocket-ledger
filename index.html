<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>小账本 · 记录每一笔</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar"><div class="brand"><span class="brand-mark">＋</span><div><p class="kicker">MY LEDGER</p><h1>小账本</h1></div></div><div class="today-chip"><span class="status-dot"></span><span id="todayLabel"></span></div></header>
      <main>
        <section class="balance-card"><div class="card-label">当前余额</div><div class="balance-value" id="balanceTotal">¥0.00</div><div class="balance-footer"><span id="entryCount">0 笔记录</span><span class="balance-note">云端同步中</span></div></section>
        <section class="stat-grid" aria-label="收支汇总"><article class="stat-card"><span class="stat-icon income-icon">↗</span><div><p>收入总额</p><strong id="incomeTotal">¥0.00</strong></div></article><article class="stat-card"><span class="stat-icon expense-icon">↘</span><div><p>支出总额</p><strong id="expenseTotal">¥0.00</strong></div></article></section>
        <section class="records-section"><div class="section-heading"><div><p class="kicker">ACTIVITY</p><h2>收支记录</h2></div><button class="add-link" id="openAdd" type="button"><span>＋</span> 新增记录</button></div><nav class="filter-tabs" aria-label="记录筛选"><button class="active" type="button" data-filter="all">全部</button><button type="button" data-filter="income">收入</button><button type="button" data-filter="expense">支出</button><span id="recordCount">0 笔</span></nav><div id="loadingState" class="loading-state">正在加载记录…</div><div id="recordList" class="record-list"></div></section>
      </main>
    </div>
    <div class="modal-backdrop hidden" id="formModal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="modal-head"><div><p class="kicker">NEW ENTRY</p><h2 id="formTitle">新增记录</h2></div><button class="close-button" id="closeModal" type="button" aria-label="关闭">×</button></div><div id="formMessage" class="form-message" role="alert"></div><form id="entryForm" novalidate><label class="field"><span>类型</span><select id="entryType" name="type"><option value="expense">支出</option><option value="income">收入</option></select></label><label class="field"><span>金额 <em>*</em></span><div class="amount-wrap"><b>¥</b><input id="entryAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required /></div></label><label class="field"><span>说明 <em>*</em></span><input id="entryDescription" name="description" type="text" maxlength="100" placeholder="例如：午餐、工资到账" required /></label><label class="field"><span>日期 <em>*</em></span><input id="entryDate" name="date" type="date" required /></label><button class="save-button" id="saveButton" type="submit">保存记录</button></form></section></div>
    <div class="toast" id="toast" role="status"></div><script src="app.js"></script>
  </body>
</html>
